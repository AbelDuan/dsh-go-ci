name: dsh-go arm64 build

# Builds AbelDuan/dsh-Go `custom` (upstream main + this fork's fixes) into an arm64 APK.
# It lives in its own repository because GitHub disables Actions on the fork itself until a
# workflow change is approved in the browser; this one is a plain repository, no approval needed.
# The APK comes out as an artifact (`dsh-go-arm64`), downloaded and installed by hand.

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.7
  FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  TZ: Asia/Shanghai
  DSH_MAVEN_MIRRORS: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: dsh-Go
    steps:
      - name: Clone AbelDuan/dsh-Go custom
        working-directory: .
        run: |
          set -euo pipefail
          git clone --depth 1 --branch custom https://github.com/AbelDuan/dsh-Go.git dsh-Go
          git -C dsh-Go log -1 --format='%h %s'
          n=$(grep -c 'AnimatedSwitcher(' dsh-Go/app/lib/ui/plugins/native/composer_strip.dart)
          test "$n" -eq 1
          echo "composer_strip.dart has one AnimatedSwitcher, as expected"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --http1.1 -o /tmp/flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "$FLUTTER_SHA256  /tmp/flutter.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/dev"
          tar -xJf /tmp/flutter.tar.xz -C "$HOME/dev"
          echo "$HOME/dev/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/dev/flutter/bin/flutter" config --no-analytics
          "$HOME/dev/flutter/bin/flutter" --version

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest"
          cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          EXT=$(find "$HOME/dev/flutter/packages/flutter_tools/gradle/src/main" -name 'FlutterExtension.*' -print -quit)
          COMPILE_SDK=$(grep -oE 'compileSdkVersion[^0-9]*[0-9]+' "$EXT" | grep -oE '[0-9]+$' | head -1)
          NDK=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "compileSdk=${COMPILE_SDK:-36} ndk=${NDK:-unknown} (+ 28.2.13676358 for tawcroot)"
          PKGS=("platform-tools" "platforms;android-${COMPILE_SDK:-36}" "build-tools;${COMPILE_SDK:-36}.0.0" "cmake;3.22.1")
          if [ -n "$NDK" ] && [ "$NDK" != "28.2.13676358" ]; then PKGS+=("ndk;$NDK"); fi
          "$SM" --sdk_root="$SDK" "${PKGS[@]}"
          curl -fL --retry 5 --retry-all-errors -o /tmp/ndk-r28c.zip \
            https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          rm -rf /tmp/ndk-unpack "$SDK/ndk/28.2.13676358"
          mkdir -p /tmp/ndk-unpack "$SDK/ndk"
          unzip -q /tmp/ndk-r28c.zip -d /tmp/ndk-unpack
          mv /tmp/ndk-unpack/android-ndk-r28c "$SDK/ndk/28.2.13676358"
          rm -f /tmp/ndk-r28c.zip
          grep '^Pkg.Revision' "$SDK/ndk/28.2.13676358/source.properties"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          "$HOME/dev/flutter/bin/flutter" config --android-sdk "$SDK"

      - name: Use the official Gradle distribution
        run: |
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/#https://services.gradle.org/distributions/#' \
            app/android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: dsh-Go/runtime/.cache
          key: runtime-cache-${{ hashFiles('dsh-Go/runtime/build-runtime.sh', 'dsh-Go/runtime/locks/**', 'dsh-Go/runtime/patches/pins.json') }}
          restore-keys: runtime-cache-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('dsh-Go/app/pubspec.lock', 'dsh-Go/packages/**/pubspec.lock') }}
          restore-keys: pub-

      - name: Use the fork's release key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          REPO_KEY=tooling/keys/dsh-go-release.keystore
          REPO_PWF=tooling/keys/password.txt
          if [ -f "$REPO_KEY" ] && [ -f "$REPO_PWF" ]; then
            STORE="$GITHUB_WORKSPACE/$REPO_KEY"
            PW=$(tr -d '\n' < "$REPO_PWF")
            echo "signing with the key committed in the repository"
          elif [ -n "${KEYSTORE_B64:-}" ]; then
            STORE="$RUNNER_TEMP/dsh-go-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$STORE"
            PW="$KEYSTORE_PASSWORD"
            echo "signing with the keystore secret"
          else
            echo "::warning::no release key available; this build is debug-signed and may not install over the phone"
            exit 0
          fi
          {
            echo "storeFile=$STORE"
            echo "storePassword=$PW"
            echo "keyAlias=dshgo"
            echo "keyPassword=$PW"
          } > app/android/key.properties
          echo "release key configured"

      - name: Build the arm64 runtime
        run: |
          set -euo pipefail
          export PATH="$HOME/dev/flutter/bin:$JAVA_HOME/bin:$PATH"
          bash runtime/build-runtime.sh arm64-v8a

      - name: Build the APK
        run: |
          set -euo pipefail
          export PATH="$HOME/dev/flutter/bin:$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64 --no-companion --no-star --keep-daemon
          ls -lh app/build/app/outputs/flutter-apk/

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64
          path: dsh-Go/app/build/app/outputs/flutter-apk/app-arm64-release.apk
          if-no-files-found: error
          retention-days: 30
